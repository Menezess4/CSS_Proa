<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Alinhamento em Flexbox com align-items e align-content</h1>

    <h3>Utilizando o align-items </h3>
    <h5>Align-items: center;</h5>
    <div class="center-1">
        <div>item 1</div>
        <div>item 2</div>
        <div>item 3</div>
    </div>
    <h4>align-items: flex-start;</h4>
    <div class="flex-start-1">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>
    <br>
    <h4>Align-items: flex-end;</h4>
    <div class="flex-end-1">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>
    <br>
    <h4>align-items:stretch</h4>
    <div class="stretch-1">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>
</body>
</html>
